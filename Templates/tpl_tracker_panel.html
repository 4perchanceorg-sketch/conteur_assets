    <div style="display:flex; align-items:center; gap:0.4rem; padding:4px 8px; background:rgba(128,128,128,0.15); cursor:pointer; user-select:none;" onclick="(function(){ var c=document.getElementById('recentStoryContentEl'); c.hidden=!c.hidden; document.getElementById('recentStoryArrow').textContent=c.hidden?'▶':'▼'; })()">
      <span id="recentStoryArrow" style="font-size:0.75rem;">▼</span>
      <span id="trackerPanelTitleEl" style="font-size:0.8rem; font-weight:bold;">📝 Character Tracker &amp; Current Scene</span>
      <span id="recentStoryTokenBadge" style="font-size:0.65rem; opacity:0.55; margin-left:auto;"></span>
    </div>
    <div id="recentStoryContentEl">

      <!-- ── Character Tracker (ex-Recent Story Context, repurposed 2026-06-12) ── (hidden when RECENT_STORY_DISABLED; the Current Scene block below is independent and stays) -->
      <div id="recentStoryCtxBlockEl" style="border-bottom:2px solid var(--box-border-color,#888);">
        <div style="display:flex; gap:0.4rem; padding:3px 8px; align-items:center; background:rgba(128,128,128,0.07);">
          <span id="trackerMemoLabelEl" style="font-size:0.65rem; opacity:0.6; margin-right:auto;">🧍 Per-character memo — location | position | state | gear | action | goal</span>
          <label id="trackerNoAutoLbl" style="font-size:72%; opacity:0.65; display:flex; align-items:center; gap:3px; cursor:pointer;" data-tooltip="When checked, the tracker will NOT auto-update before each generation">
            <input type="checkbox" id="noAutoUpdateRecentContextChk" onchange="localStorage.noAutoUpdateRecentContext=this.checked?'true':'false';" style="margin:0; cursor:pointer;">
            <span id="trackerNoAutoTextEl">no auto-update</span>
          </label>
          <label id="trackerDisableLbl" style="font-size:72%; opacity:0.75; display:flex; align-items:center; gap:3px; cursor:pointer;" data-tooltip="Turn the tracker off completely — it stops auto-updating and is no longer sent to the AI. Your memo is kept.">
            <input type="checkbox" id="trackerDisableChk" style="margin:0; cursor:pointer;" onchange="window.setTrackerDisabled && window.setTrackerDisabled(this.checked)">
            <span id="trackerDisableTextEl">🚫 Do not use</span>
          </label>
          <button id="trackerUpdateBtn" onclick="window._recentContextSummaryRunning = false; if(window._preGenRunning||window.generatingStory){ window._trackerManualQueued=true; this.textContent='⏳'; this.setAttribute('data-tooltip', window.confT ? window.confT('tt_trackerQueued') : 'Queued — will update automatically once the current generation/pre-gen finishes.'); console.log('[tracker] manual 🔄 queued — will run once the generation/pre-gen finishes'); } window._runRecentContextSummary && window._runRecentContextSummary();" style="font-size:70%; padding:2px 6px;" data-tooltip="Update the tracker now from the recent story text">🔄</button>
          <button id="trackerUnlockBtn" hidden onclick="window._trackerClearLocks && window._trackerClearLocks();" style="font-size:70%; padding:2px 6px;" data-tooltip="Locked cells: values you edited by hand are kept and force-applied over each auto-update (the AI can no longer revert them). Click to release ALL locks and let the auto-update take those cells back.">🔓 <span id="trackerLockCount">0</span></button>
          <button id="trackerClearBtn" onclick="window.clearTrackerMemo && window.clearTrackerMemo('button')" style="font-size:70%; padding:2px 6px;" data-tooltip="Clear the character tracker (and release any manual locks)">🗑️</button>
        </div>
        <textarea id="recentStoryTextEl" oninput="localStorage.recentChapterContextSummary=this.value;" onchange="window._trackerCaptureManualLocks && window._trackerCaptureManualLocks();" style="display:block; width:100%; font-size:0.75rem; min-height:5rem; resize:vertical; border:none; background:transparent; padding:6px 8px; box-sizing:border-box; color:inherit;" placeholder="(Empty — updates automatically every ~600 new words of story: one line per character — Name — location | position | state | gear | action | goal. Editable: a cell you change is LOCKED 🔒 and kept against the auto-update. Cleared at each chapter marker.)"></textarea>
      </div>

      <!-- ── Current Scene (5 lockable sub-fields) ── -->
      <div>
        <div style="display:flex; gap:0.4rem; padding:3px 8px; align-items:center; background:rgba(128,128,128,0.07);">
          <span id="currentSceneLabelEl" style="font-size:0.65rem; opacity:0.6; margin-right:auto;">📍 Current scene — highest-priority context</span>
          <label id="sceneDisableLbl" style="font-size:72%; opacity:0.75; display:flex; align-items:center; gap:3px; cursor:pointer;" data-tooltip="Turn Current Scene off completely — it is no longer sent to the AI. Your fields are kept.">
            <input type="checkbox" id="sceneDisableChk" style="margin:0; cursor:pointer;" onchange="window.setSceneDisabled && window.setSceneDisabled(this.checked)">
            <span id="sceneDisableTextEl">🚫 Do not use</span>
          </label>
          <button id="autoFillSceneBtn" onclick="window.autoFillCurrentScene && window.autoFillCurrentScene();" style="font-size:70%; padding:1px 5px;" data-tooltip="Auto-extract scene from recent story text (only unlocked fields are overwritten)">✨ Auto-fill</button>
          <button id="wipeSceneBtn" onclick="window.wipeCurrentScene && window.wipeCurrentScene('fields');" style="font-size:70%; padding:1px 5px;" data-tooltip="Wipe all current-scene fields (keeps 🔒 locks)">🗑️</button>
        </div>
        <div id="currentSceneFieldsContainer">
          <!-- 5 sub-fields rendered dynamically: location, characters, moment, atmosphere, notes -->
        </div>
      </div>

    </div>
