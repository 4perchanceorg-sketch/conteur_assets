    <div style="display:flex; align-items:center; gap:0.4rem; padding:4px 8px; background:rgba(128,128,128,0.15); cursor:pointer; user-select:none; border-radius:4px 4px 0 0;" onclick="(function(){ var c=document.getElementById('pyramidContentEl'); c.hidden=!c.hidden; document.getElementById('pyramidArrow').textContent=c.hidden?'▶':'▼'; })()">
      <span id="pyramidArrow" style="font-size:0.75rem;">▼</span>

          <input type="checkbox" id="pyramidPauseChk" onchange="(window.setMemoryMode ? window.setMemoryMode(this.checked ? 'bible' : 'pyramid', {source:'panel-checkbox'}) : (window.setStoryPyramidPaused && window.setStoryPyramidPaused(this.checked)));" style="margin:0; cursor:pointer;"> ⏸️ Bible mode

          <input type="checkbox" id="pyramidScoresChk" onchange="window.setStoryPyramidScores && window.setStoryPyramidScores(this.checked);" style="margin:0; cursor:pointer;"> 📊 Scores

        <button id="pyramidClearBtn" onclick="window.clearStoryPyramid && window.clearStoryPyramid();" style="font-size:70%; padding:2px 6px;" data-tooltip="Clear the MEMORY (ledger + lore + timeline). Your story text stays. Undo available.">🗑️</button>
        <button id="pyramidUndoBtn" hidden onclick="window.undoStoryPyramidClear && window.undoStoryPyramidClear();" style="font-size:70%; padding:2px 6px;" data-tooltip="Undo the last memory clear/compact/rebuild">↶</button>
        <button id="pyramidCompactBtn" onclick="window.compactStoryPyramid && window.compactStoryPyramid();" style="font-size:70%; padding:2px 6px;" data-tooltip="Compact the MEMORY itself (tighter ledger + lore + merged older timeline lines). NEVER touches the story text. Undo available.">✂️</button>
        <button id="pyramidCurateBtn" onclick="window.openPyramidCurationModal && window.openPyramidCurationModal();" style="font-size:70%; padding:2px 6px;" data-tooltip="Curate the memory — open a floating window listing every fact across the three tiers with a checkbox: keep (checked = active, sent to the AI), archive (unchecked = kept but never sent), revive (re-check an archived fact → active + pinned), or 🗑️ delete for good.">🗂️</button>
